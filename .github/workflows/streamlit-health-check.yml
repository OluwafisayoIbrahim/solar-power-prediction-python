name: Streamlit Health Check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-health-check.txt

      - name: Install monitoring dependencies
        run: |
          python -m pip install -r scripts/requirements-health-check.txt
          python -m playwright install --with-deps --only-shell chromium

      - name: Test monitor against local browser fixtures
        run: python -m unittest discover -s tests -p test_streamlit_health_check.py -v
        env:
          RUN_HEALTH_BROWSER_TESTS: '1'

      - name: Verify public Streamlit interface
        id: health
        run: python scripts/check_streamlit.py --timeout 180

      - name: Upload failure diagnostics
        if: ${{ failure() && steps.health.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: streamlit-health-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: health-check-artifacts/
          if-no-files-found: warn
          retention-days: 7
